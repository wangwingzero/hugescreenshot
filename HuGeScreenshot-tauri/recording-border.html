<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  .border {
    position: absolute;
    inset: 0;
    border: 3px solid #ff4444;
    border-radius: 2px;
    pointer-events: none;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { border-color: #ff4444; }
    50% { border-color: #ff8888; }
  }
</style>
</head>
<body>
  <div class="border"></div>
</body>
</html>
